<nav class="header navbar navbar-expand-lg" 
     [style.background-color]="headerData.background_image.is_image ? 'transparent' : headerData.background_image.color">
  <div class="container-fluid">
    @if(headerData.main_image) {
      <a class="navbar-brand" href="/home" [attr.aria-label]="headerData.main_image.title">
        <img [ngSrc]="headerData.main_image.src" 
             width="252" 
             height="42" 
             [alt]="headerData.main_image.title" 
             priority>
      </a>
    }
    
    @if(menu) {
      <button class="btn btn-link d-lg-none" 
              type="button" 
              data-bs-toggle="collapse" 
              data-bs-target="#navbarSupportedContent" 
              aria-controls="navbarSupportedContent" 
              aria-expanded="false" 
              aria-label="Toggle navigation">
        <fa-icon [icon]="['fas', 'bars']" class="text-warning fa-2xl"></fa-icon>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Link</a>
          </li>
        </ul>
      </div>
    }
    
    <div class="d-none d-md-flex gap-2">
      @for(cta of headerData.call_to_action; track cta.label) {
        <button 
           [class]="cta.color_in_background ? 'button-yellow' : 'button-transparent'">
          {{ cta.label }}
      </button>
      }
    </div>
  </div>
</nav>
