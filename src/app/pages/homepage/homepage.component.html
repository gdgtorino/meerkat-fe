<div class="container-xxl">
  <app-headline [headlineData]="homeData.header"></app-headline>
  <div id="speakers" class="mt-lg-5 mt-3">
    <div class="d-flex justify-content-between mb-4">
      <h2 class="head-1">Speakers</h2>
      <button type="button" aria-label="view more speakers" class="btn btn-link text-primary align-items-center d-flex hyperlink-text">
        View more
        <fa-icon [icon]="['fas', 'chevron-right']"></fa-icon>
      </button>
    </div>
    <div class="row">
      @if(1) {
        <div class="col-lg-3 col-12">
          <app-card-user [isSpeaker]="true"></app-card-user>
        </div>
      } @else {
        <div class="col-lg-8 col-12 mx-auto cf-card rounded-3 d-flex justify-content-between align-items-end">
          <div>
            <h3 class="head-1">Call for paper is open</h3>
            <p class="head-3 mb-0">Submit your talk proposal by 30-08-2024</p>
          </div>
          <div class="ms-auto">
            <button class="button-red" type="button" aria-label="cfp button">Go to cfp</button>
          </div>
        </div>
      }

    </div>

  </div>
  <div id="location" class="my-5">
    <app-section-location></app-section-location>
  </div>


  <div id="organizers" class="mt-lg-5 mt-3">
    <div class="d-flex justify-content-between mb-4">
      <h2 class="head-1">Organizers</h2>
      <button type="button" aria-label="view more speakers" class="btn btn-link text-primary align-items-center d-flex hyperlink-text">
        View more
        <fa-icon [icon]="['fas', 'chevron-right']"></fa-icon>
      </button>
    </div>
    <div class="row">
      <div class="col-lg-3 col-12">
        <app-card-user [isSpeaker]="false"></app-card-user>
      </div>
    </div>
    @if (1){
      <div class="row mt-4">
        <div class="col-lg-8 col-12 mx-auto cf-card rounded-3 d-flex justify-content-between align-items-end">
          <div>
            <h3 class="head-1">Call for helpers is open</h3>
            <p class="head-3 mb-0">become helper of conference by 30-08-2024</p>
          </div>
          <div class="ms-auto">
            <button class="button-red" type="button" aria-label="cfp button">Go to cfh</button>
          </div>
        </div>
      </div>
    }
  </div>
</div>
